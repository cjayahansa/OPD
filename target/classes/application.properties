spring.application.name=post
server.port=8080
spring.jpa.hibernate.ddl-auto=update
#meken thamai data base eka update wenne ekiyanne hama thissema aluthen ewa hadenne nathuwa thiyana ekama update wena eka
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/OPD?createDatabaseIfNotExist=true
#create kiyana eken karanne e link eken gihilla ehema data base ekak nathnam aluth ekak hadanna kiyanaa eka
spring.datasource.username=root
spring.datasource.password=Root
#jpa vender adapter configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html